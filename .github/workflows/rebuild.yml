name: Rebuild from upstream

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install the tools
        run: |
          pip install fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontforge

      - run: python3 build.py
      - run: python3 build-nerd.py

      - name: Commit when the fonts changed
        id: commit
        run: |
          # --porcelain, not diff: new files under fonts/nerd are untracked
          if [ -z "$(git status --porcelain -- fonts UPSTREAM)" ]; then
            echo "Upstream is unchanged. Nothing to do."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts UPSTREAM
          git commit -m "Rebuild from $(head -1 UPSTREAM)"
          git push

      # A release gives a stable download URL, so nobody has to clone the repo.
      - name: Publish a release
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(head -1 UPSTREAM | sed 's/.*Version //')
          tag="v${version}.$(date -u +%Y%m%d)"

          mkdir -p dist
          zip -qj dist/SnugMono.zip          fonts/SnugMono*.ttf OFL.txt README.md
          zip -qj dist/SnugMono-NerdFont.zip     fonts/nerd/SnugMonoNerdFont-*.ttf     OFL.txt README.md
          zip -qj dist/SnugMono-NerdFontMono.zip fonts/nerd/SnugMonoNerdFontMono-*.ttf OFL.txt README.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip \
              --title "Snug Mono $tag" \
              --notes "Built from Atkinson Hyperlegible Mono Version ${version}.

          | Download | Family name | Contents |
          |---|---|---|
          | \`SnugMono.zip\` | \`Snug Mono\` | 2 variable fonts, weight 200-800, roman and italic |
          | \`SnugMono-NerdFont.zip\` | \`SnugMono Nerd Font\` | 4 static fonts, icons at their natural width |
          | \`SnugMono-NerdFontMono.zip\` | \`SnugMono Nerd Font Mono\` | 4 static fonts, each icon in one cell |

          To install, unzip the archive. On macOS, copy the \`.ttf\` files to \`~/Library/Fonts\`. On Linux, copy them to \`~/.local/share/fonts\` and then run \`fc-cache -f\`."
          fi

          # Point the Homebrew casks at the release that this run just made.
          for pair in "font-snug-mono:SnugMono" "font-snug-mono-nerd-font:SnugMono-NerdFont" "font-snug-mono-nerd-font-mono:SnugMono-NerdFontMono"; do
            cask="${pair%%:*}"; archive="${pair##*:}"
            sum=$(sha256sum "dist/${archive}.zip" | cut -d" " -f1)
            sed -i -E "s|^  version \".*\"|  version \"${tag#v}\"|; \
                       s|^  sha256 \".*\"|  sha256 \"${sum}\"|" "Casks/${cask}.rb"
          done

          if [ -n "$(git status --porcelain -- Casks)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks
            git commit -m "chore: point the casks at ${tag}"
            git push
          fi

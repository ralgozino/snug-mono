name: Rebuild from upstream

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install fonttools
      - run: python3 build.py

      - name: Commit when the source font changed
        run: |
          if git diff --quiet -- fonts UPSTREAM; then
            echo "Upstream is unchanged. Nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts UPSTREAM
          git commit -m "Rebuild from $(head -1 UPSTREAM)"
          git push
